<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="집중을 위한 심플한 Pomodoro 타이머" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="index.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="pomodoro">
      <section class="timer-card" aria-labelledby="page-title">
        <div class="timer-card__header">
          <span class="status-dot" aria-hidden="true"></span>
          <p class="status-text" id="timer-status">집중 시간</p>
        </div>

        <h1 id="page-title">Pomodoro</h1>

        <div class="time" role="timer" aria-live="off" aria-label="남은 시간 25분 0초">
          <span id="minutes">25</span><span class="time__colon">:</span><span id="seconds">00</span>
        </div>

        <p class="message">한 번에 하나씩, 차분하게 집중해 보세요.</p>

        <div class="controls" aria-label="타이머 조작">
          <button class="button button--primary" id="start-button" type="button" onclick="startTimer()">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 5.5v13l10-6.5-10-6.5Z" />
            </svg>
            시작
          </button>
          <button class="button" id="stop-button" type="button" onclick="stopTimer()">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M7 6h3.5v12H7V6Zm6.5 0H17v12h-3.5V6Z" />
            </svg>
            정지
          </button>
          <button class="button" id="reset-button" type="button" onclick="resetTimer()">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M18.7 7.1A8 8 0 1 0 20 14h-2.1a6 6 0 1 1-.8-5.4L14 11.7h7V5l-2.3 2.1Z" />
            </svg>
            초기화
          </button>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <a class="settings-button" href="settings.html">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M19.4 13a7.2 7.2 0 0 0 .1-1 7.2 7.2 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4L10.7 6A7.6 7.6 0 0 0 9 7L6.6 6l-2 3.4 2 1.6a7.2 7.2 0 0 0-.1 1 7.2 7.2 0 0 0 .1 1l-2 1.6 2 3.4L9 17a7.6 7.6 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" />
          </svg>
          타이머 설정
        </a>
      </section>

      <p class="footer-copy">FOCUS · REST · REPEAT</p>
    </main>
  </body>
</html>
